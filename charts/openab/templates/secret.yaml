{{- range $name, $cfg := .Values.agents }}
{{- if ne (include "openab.agentEnabled" $cfg) "false" }}
{{- $hasDiscord := and (ne (toString ($cfg.discord).enabled) "false") ($cfg.discord).botToken }}
{{- $univerWorkspaceHost := dig "host" "" ($cfg.univerWorkspace | default dict) }}
{{- $univerWorkspaceApiKey := dig "apiKey" "" ($cfg.univerWorkspace | default dict) }}
{{- $univerWorkspaceBotCookie := dig "botCookie" "" ($cfg.univerWorkspace | default dict) }}
{{- $hasUniverWorkspace := and $univerWorkspaceHost $univerWorkspaceApiKey $univerWorkspaceBotCookie }}
{{- $hasSlack := and ($cfg.slack).enabled (or ($cfg.slack).botToken ($cfg.slack).appToken) (not ($cfg.slack).existingSecret) }}
{{- $hasStt := and ($cfg.stt).enabled ($cfg.stt).apiKey }}
{{- $hasContextMcp := and ($cfg.contextMcp).enabled ($cfg.contextMcp).token (not ($cfg.contextMcp).existingSecret) }}
{{- $hasGateway := and ($cfg.gateway).enabled ($cfg.gateway).token }}
{{- if or $hasDiscord $hasUniverWorkspace $hasSlack $hasStt $hasContextMcp $hasGateway }}
{{- $d := dict "ctx" $ "agent" $name "cfg" $cfg }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openab.agentFullname" $d }}
  labels:
    {{- include "openab.labels" $d | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if $hasDiscord }}
  discord-bot-token: {{ $cfg.discord.botToken | b64enc | quote }}
  {{- end }}
  {{- if $hasUniverWorkspace }}
  univer-workspace-api-key: {{ $univerWorkspaceApiKey | b64enc | quote }}
  univer-workspace-bot-cookie: {{ $univerWorkspaceBotCookie | b64enc | quote }}
  {{- end }}
  {{- if and ($cfg.slack).enabled ($cfg.slack).botToken (not ($cfg.slack).existingSecret) }}
  slack-bot-token: {{ $cfg.slack.botToken | b64enc | quote }}
  {{- end }}
  {{- if and ($cfg.slack).enabled ($cfg.slack).appToken (not ($cfg.slack).existingSecret) }}
  slack-app-token: {{ $cfg.slack.appToken | b64enc | quote }}
  {{- end }}
  {{- if $hasStt }}
  stt-api-key: {{ $cfg.stt.apiKey | b64enc | quote }}
  {{- end }}
  {{- if $hasContextMcp }}
  context-mcp-token: {{ $cfg.contextMcp.token | b64enc | quote }}
  {{- end }}
  {{- if $hasGateway }}
  gateway-ws-token: {{ $cfg.gateway.token | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
